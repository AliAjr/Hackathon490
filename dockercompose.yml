version: "3.9"

services:
  app:
    build: .
    image: crash-hotspot:latest
    container_name: hotspot_app
    ports:
      - "8501:8501"
    # Share a small data volume for predictions
    volumes:
      - predictions_data:/app
      # Optional: mount your local Kaggle token (read-only)
      # - ~/.kaggle:/root/.kaggle:ro
    environment:
      # Streamlit reads these via ENV we set in Dockerfile; override here if needed
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
    # App starts even if predictions.csv doesn't exist—you can upload via UI.
    # If you want it to require a file at start, generate it first with the "predict" service below.

  predict:
    build: .
    image: crash-hotspot:latest
    container_name: hotspot_predict
    # One-shot job to generate predictions.csv using Kaggle datasets
    command: ["python", "Hotspot_crash_prediction_universal.py"]
    # Share the same volume so predictions.csv appears for the app
    volumes:
      - predictions_data:/app
      # Your Kaggle token goes here so kagglehub can download:
      - ~/.kaggle:/root/.kaggle:ro
    # Don’t run this on every `up` by default; invoke explicitly when needed.
    restart: "no"

volumes:
  predictions_data:
